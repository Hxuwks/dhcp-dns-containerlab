vrrp_instance VI_10 {
    state BACKUP
    interface eth1.10
    virtual_router_id 10
    priority 90
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass secpass
    }
    virtual_ipaddress {
        192.168.10.1/24
    }
}

