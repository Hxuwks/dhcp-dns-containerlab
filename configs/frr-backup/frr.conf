frr version 10.5.1
frr defaults traditional
hostname frr-gateway
log stderr
!
interface eth1
    description Trunk to SW-DEV (VLAN 10)
    exit
!
interface eth2
    description Trunk to SW-SRV (VLAN 20)
    exit
!
interface eth3
    description Trunk to SW-USR (VLAN 30)
    exit
!
interface eth1.10
    description Gateway IP for DEV Segment (VLAN 10)
    ip address 192.168.10.1/24
    exit
!
interface eth2.20
    description Gateway IP for SERVER Segment (VLAN 20)
    ip address 192.168.20.1/24
    exit
!
interface eth3.30
    description Gateway IP for USER Segment (VLAN 30)
    ip address 192.168.30.1/24
    exit
!
ip forwarding
!
line vty
    exit